<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>SURF BASE - 条件設定管理</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Teko:wght@600;700&family=Noto+Sans+JP:wght@400;500;700;900&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Noto Sans JP', sans-serif; }
    .font-teko { font-family: 'Teko', sans-serif; }
  </style>
</head>
<body class="bg-slate-100 text-slate-800 min-h-screen pb-12">

  <!-- HEADER -->
  <header class="bg-white/95 backdrop-blur-md border-b border-slate-200 px-4 py-3 sticky top-0 z-30 shadow-sm">
    <div class="max-w-md mx-auto flex items-center justify-between">
      <a href="index.html" class="text-xs font-bold text-sky-600 hover:text-sky-800 flex items-center gap-1.5 py-1 px-2 rounded-lg bg-sky-50 border border-sky-200/80">
        <i class="fa-solid fa-arrow-left"></i>
        <span>アプリへ戻る</span>
      </a>
      <div class="text-center">
        <h1 class="text-sm font-bold text-slate-800 flex items-center justify-center gap-1.5">
          <i class="fa-solid fa-sliders text-sky-600"></i>
          ポイント条件管理
        </h1>
      </div>
      <button onclick="logout()" id="logoutBtn" class="text-xs text-slate-400 hover:text-rose-600 hidden font-bold">
        ログアウト
      </button>
    </div>
  </header>

  <!-- MAIN -->
  <main class="max-w-md mx-auto px-3.5 pt-4 space-y-4">

    <!-- ログイン画面（未認証時） -->
    <div id="loginCard" class="bg-white rounded-2xl p-5 border border-slate-200 shadow-md space-y-4">
      <div class="text-center space-y-1">
        <div class="w-12 h-12 rounded-2xl bg-sky-50 border border-sky-200 text-sky-600 flex items-center justify-center mx-auto text-xl shadow-sm">
          <i class="fa-solid fa-lock"></i>
        </div>
        <h2 class="font-bold text-base text-slate-800">管理者ログイン</h2>
        <p class="text-xs text-slate-400">各サーフポイントの波条件設定を変更できます</p>
      </div>

      <div class="space-y-3 pt-2">
        <div>
          <label class="text-xs font-bold text-slate-700 block mb-1">管理者パスワード</label>
          <input type="password" id="passwordInput" placeholder="パスワードを入力" class="w-full text-sm py-2.5 px-3 rounded-xl border border-slate-200 bg-slate-50 focus:outline-none focus:ring-2 focus:ring-sky-500 font-mono">
        </div>

        <button onclick="login()" class="w-full py-2.5 rounded-xl bg-gradient-to-r from-sky-600 to-blue-600 text-white font-bold text-sm shadow-md shadow-sky-500/20 active:scale-95 transition">
          ログインして設定を開く
        </button>
        <p id="loginError" class="text-xs text-rose-600 font-bold text-center hidden">パスワードが正しくありません</p>
      </div>
    </div>

    <!-- 管理パネル本体（認証後表示） -->
    <div id="adminPanel" class="space-y-4 hidden">

      <!-- ポイント切替タブ -->
      <div class="grid grid-cols-4 gap-1 p-1 bg-slate-200/80 rounded-2xl border border-slate-300/60 shadow-inner">
        <button onclick="selectSpot('suishohama')" id="tab-suishohama" class="spot-tab py-2 px-1 text-center rounded-xl font-bold text-xs transition duration-200 bg-white text-sky-700 shadow-sm border border-slate-200">
          水晶浜
        </button>
        <button onclick="selectSpot('sugahama')" id="tab-sugahama" class="spot-tab py-2 px-1 text-center rounded-xl font-bold text-xs transition duration-200 text-slate-600 hover:text-slate-900">
          菅浜
        </button>
        <button onclick="selectSpot('kurosaki')" id="tab-kurosaki" class="spot-tab py-2 px-1 text-center rounded-xl font-bold text-xs transition duration-200 text-slate-600 hover:text-slate-900">
          黒崎
        </button>
        <button onclick="selectSpot('echizen')" id="tab-echizen" class="spot-tab py-2 px-1 text-center rounded-xl font-bold text-xs transition duration-200 text-slate-600 hover:text-slate-900">
          越前ﾘｰﾌ
        </button>
      </div>

      <!-- 設定入力フォームカード -->
      <div class="bg-white rounded-2xl p-4 border border-slate-200 shadow-md space-y-4">
        
        <!-- ポイント名 & ビーチの向き -->
        <div class="flex items-center justify-between border-b border-slate-100 pb-3">
          <div>
            <h3 id="spotTitle" class="text-base font-black text-slate-800">水晶浜</h3>
            <span class="text-[10px] text-slate-400 font-medium">条件設定のチューニング</span>
          </div>
          <div class="text-right">
            <label class="text-[10px] font-bold text-slate-500 block mb-0.5">ビーチの向き</label>
            <select id="beachFacing" onchange="updateCurrentSpotValue('beachFacing', this.value)" class="text-xs py-1 px-2 rounded-lg border border-slate-200 bg-slate-50 font-bold text-slate-700">
            </select>
          </div>
        </div>

        <!-- 1. 波高（ナウファス連動）設定 -->
        <div class="space-y-3">
          <span class="text-xs font-bold text-slate-700 flex items-center gap-1.5">
            <i class="fa-solid fa-water text-sky-600"></i>
            波高の判定基準（m）
          </span>

          <div class="grid grid-cols-3 gap-2 text-center">
            <div class="p-2.5 rounded-xl bg-slate-50 border border-slate-200/80">
              <span class="text-[10px] text-slate-400 font-bold block mb-1">最低割れ始め</span>
              <input type="number" step="0.1" id="minPlayWave" onchange="updateCurrentSpotValue('minPlayWave', parseFloat(this.value))" class="w-full text-center text-sm font-bold py-1 rounded border border-slate-200 bg-white">
              <span class="text-[9px] text-slate-400 mt-1 block">未満はFLAT</span>
            </div>

            <div class="p-2.5 rounded-xl bg-slate-50 border border-slate-200/80">
              <span class="text-[10px] text-sky-700 font-bold block mb-1">胸〜肩サイズ</span>
              <input type="number" step="0.1" id="chestHeadWave" onchange="updateCurrentSpotValue('chestHeadWave', parseFloat(this.value))" class="w-full text-center text-sm font-bold py-1 rounded border border-sky-300 bg-white text-sky-800">
              <span class="text-[9px] text-sky-600 font-medium mt-1 block">良波基準</span>
            </div>

            <div class="p-2.5 rounded-xl bg-slate-50 border border-slate-200/80">
              <span class="text-[10px] text-rose-700 font-bold block mb-1">クローズ危険</span>
              <input type="number" step="0.1" id="closeoutWave" onchange="updateCurrentSpotValue('closeoutWave', parseFloat(this.value))" class="w-full text-center text-sm font-bold py-1 rounded border border-rose-300 bg-white text-rose-800">
              <span class="text-[9px] text-rose-500 font-medium mt-1 block">以上はCLOSE</span>
            </div>
          </div>
        </div>

        <!-- 2. 周期設定 -->
        <div class="space-y-3 pt-2 border-t border-slate-100">
          <span class="text-xs font-bold text-slate-700 flex items-center gap-1.5">
            <i class="fa-solid fa-stopwatch text-indigo-600"></i>
            波の周期基準（秒）
          </span>

          <div class="grid grid-cols-2 gap-2 text-center">
            <div class="p-2.5 rounded-xl bg-slate-50 border border-slate-200/80">
              <span class="text-[10px] text-slate-500 font-bold block mb-1">最低必要周期</span>
              <input type="number" step="0.1" id="minPeriod" onchange="updateCurrentSpotValue('minPeriod', parseFloat(this.value))" class="w-full text-center text-sm font-bold py-1 rounded border border-slate-200 bg-white">
              <span class="text-[9px] text-slate-400 mt-1 block">未満はパワー不足</span>
            </div>

            <div class="p-2.5 rounded-xl bg-slate-50 border border-slate-200/80">
              <span class="text-[10px] text-emerald-700 font-bold block mb-1">極上セット周期</span>
              <input type="number" step="0.1" id="bestPeriod" onchange="updateCurrentSpotValue('bestPeriod', parseFloat(this.value))" class="w-full text-center text-sm font-bold py-1 rounded border border-emerald-300 bg-white text-emerald-800">
              <span class="text-[9px] text-emerald-600 font-medium mt-1 block">以上でBEST判定</span>
            </div>
          </div>
        </div>

        <!-- 3. オフショア風向設定（16方位ボタングリッド） -->
        <div class="space-y-2 pt-2 border-t border-slate-100">
          <div class="flex items-center justify-between">
            <span class="text-xs font-bold text-slate-700 flex items-center gap-1.5">
              <i class="fa-solid fa-wind text-emerald-600"></i>
              オフショア風向（面ツル・整う風）
            </span>
            <span class="text-[10px] text-emerald-700 font-bold" id="offshoreSummary"></span>
          </div>
          <p class="text-[10px] text-slate-400">タップでON/OFFを切り替えてください（複数選択可）</p>
          <div class="grid grid-cols-4 gap-1.5 pt-1" id="offshoreButtons">
          </div>
        </div>

        <!-- 4. ベストウネリ波向設定（16方位ボタングリッド） -->
        <div class="space-y-2 pt-2 border-t border-slate-100">
          <div class="flex items-center justify-between">
            <span class="text-xs font-bold text-slate-700 flex items-center gap-1.5">
              <i class="fa-solid fa-compass text-sky-600"></i>
              ベストなウネリ波向（入る向き）
            </span>
            <span class="text-[10px] text-sky-700 font-bold" id="bestWaveSummary"></span>
          </div>
          <p class="text-[10px] text-slate-400">タップでON/OFFを切り替えてください（複数選択可）</p>
          <div class="grid grid-cols-4 gap-1.5 pt-1" id="bestWaveButtons">
          </div>
        </div>

      </div>

      <!-- 送信・反映アクションバー -->
      <div class="space-y-2 pt-2">
        <button onclick="saveRulesToGitHub()" id="saveBtn" class="w-full py-3 rounded-2xl bg-gradient-to-r from-emerald-600 to-teal-600 text-white font-bold text-sm shadow-lg shadow-emerald-500/25 active:scale-95 transition flex items-center justify-center gap-2">
          <i class="fa-solid fa-cloud-arrow-up"></i>
          <span>設定を保存して全ユーザーに反映する</span>
        </button>

        <div class="flex items-center gap-2">
          <button onclick="copyRulesJson()" class="w-1/2 py-2 rounded-xl bg-white border border-slate-200 text-slate-600 hover:text-slate-800 font-bold text-xs active:scale-95 transition flex items-center justify-center gap-1.5 shadow-sm">
            <i class="fa-solid fa-copy"></i>
            <span>設定JSONをコピー</span>
          </button>
          <button onclick="resetToDefault()" class="w-1/2 py-2 rounded-xl bg-white border border-slate-200 text-slate-500 hover:text-rose-600 font-bold text-xs active:scale-95 transition flex items-center justify-center gap-1.5 shadow-sm">
            <i class="fa-solid fa-rotate-left"></i>
            <span>初期値に戻す</span>
          </button>
        </div>

        <p id="statusMsg" class="text-xs text-center font-bold min-h-[1.5rem] py-1"></p>
      </div>

      <!-- パスワード変更モーダル呼び出し -->
      <div class="text-center pt-3">
        <button onclick="promptChangePassword()" class="text-[11px] text-slate-400 hover:text-slate-600 underline">
          管理者パスワードを変更する
        </button>
      </div>

    </div>

  </main>

  <script>
    const DIRS_16 = ['N', 'NNE', 'NE', 'ENE', 'E', 'ESE', 'SE', 'SSE', 'S', 'SSW', 'SW', 'WSW', 'W', 'WNW', 'NW', 'NNW'];
    const DIR_JA = {
      'N': '北', 'NNE': '北北東', 'NE': '北東', 'ENE': '東北東',
      'E': '東', 'ESE': '東南東', 'SE': '南東', 'SSE': '南南東',
      'S': '南', 'SSW': '南南西', 'SW': '南西', 'WSW': '西南西',
      'W': '西', 'WNW': '西北西', 'NW': '北西', 'NNW': '北北西'
    };

    const DEFAULT_RULES = {
      suishohama: {
        name: '水晶浜', beachFacing: 'W',
        minPlayWave: 0.7, chestHeadWave: 1.0, closeoutWave: 1.5, minPeriod: 5.0, bestPeriod: 7.5,
        offshoreWinds: ['E', 'ENE', 'ESE'],
        bestWaveDirs: ['NE', 'NNE', 'N', 'NNW', 'NW', 'WNW', 'W']
      },
      sugahama: {
        name: '菅浜', beachFacing: 'NW',
        minPlayWave: 1.6, chestHeadWave: 1.8, closeoutWave: 2.6, minPeriod: 6.0, bestPeriod: 8.0,
        offshoreWinds: ['E', 'ENE', 'ESE'],
        bestWaveDirs: ['N', 'NNW', 'NW', 'WNW', 'W']
      },
      kurosaki: {
        name: '黒崎', beachFacing: 'N',
        minPlayWave: 0.7, chestHeadWave: 1.3, closeoutWave: 1.8, minPeriod: 6.0, bestPeriod: 7.5,
        offshoreWinds: ['SE', 'SSE', 'ESE'],
        bestWaveDirs: ['N', 'NNE', 'NE']
      },
      echizen: {
        name: '越前リーフ', beachFacing: 'W',
        minPlayWave: 0.9, chestHeadWave: 1.1, closeoutWave: 1.6, minPeriod: 6.0, bestPeriod: 7.5,
        offshoreWinds: ['E', 'ENE', 'ESE'],
        bestWaveDirs: ['NE', 'NNE', 'N']
      }
    };

    let CURRENT_RULES = JSON.parse(JSON.stringify(DEFAULT_RULES));
    let currentSpotKey = 'suishohama';
    const PASS_STORAGE_KEY = 'SURF_BASE_ADMIN_PASSWORD_V1';
    const TOKEN_STORAGE_KEY = 'SURF_BASE_ADMIN_GH_TOKEN_V1';
    const GITHUB_REPO = 'dmmiea/surf-base';

    function getSavedPassword() {
      return localStorage.getItem(PASS_STORAGE_KEY) || 'surf2026';
    }

    function checkAuth() {
      if (sessionStorage.getItem('SURF_BASE_ADMIN_AUTH') === 'true') {
        showPanel();
      }
    }

    function login() {
      const input = document.getElementById('passwordInput').value.trim();
      const err = document.getElementById('loginError');
      if (input === getSavedPassword()) {
        sessionStorage.setItem('SURF_BASE_ADMIN_AUTH', 'true');
        err.classList.add('hidden');
        showPanel();
      } else {
        err.classList.remove('hidden');
      }
    }

    function logout() {
      sessionStorage.removeItem('SURF_BASE_ADMIN_AUTH');
      document.getElementById('adminPanel').classList.add('hidden');
      document.getElementById('loginCard').classList.remove('hidden');
      document.getElementById('logoutBtn').classList.add('hidden');
      document.getElementById('passwordInput').value = '';
    }

    function showPanel() {
      document.getElementById('loginCard').classList.add('hidden');
      document.getElementById('adminPanel').classList.remove('hidden');
      document.getElementById('logoutBtn').classList.remove('hidden');
      initControls();
      loadRules();
    }

    async function loadRules() {
      try {
        const res = await fetch('spot_rules.json?t=' + Date.now());
        if (res.ok) {
          const data = await res.json();
          CURRENT_RULES = Object.assign(CURRENT_RULES, data);
        }
      } catch (e) {
        console.warn('Fallback to local rules:', e);
      }
      renderSpotForm();
    }

    function initControls() {
      const sel = document.getElementById('beachFacing');
      sel.innerHTML = '';
      DIRS_16.forEach(d => {
        const opt = document.createElement('option');
        opt.value = d;
        opt.textContent = DIR_JA[d] + " (" + d + ")";
        sel.appendChild(opt);
      });

      const offDiv = document.getElementById('offshoreButtons');
      const waveDiv = document.getElementById('bestWaveButtons');
      offDiv.innerHTML = '';
      waveDiv.innerHTML = '';

      DIRS_16.forEach(d => {
        const btnOff = document.createElement('button');
        btnOff.id = 'btn-off-' + d;
        btnOff.type = 'button';
        btnOff.className = 'py-1.5 px-1 rounded-lg text-xs font-bold border transition text-center';
        btnOff.innerHTML = '<span class="block text-[11px]">' + d + '</span><span class="text-[9px] text-slate-400 font-normal">' + DIR_JA[d] + '</span>';
        btnOff.onclick = () => toggleOffshore(d);
        offDiv.appendChild(btnOff);

        const btnWave = document.createElement('button');
        btnWave.id = 'btn-wave-' + d;
        btnWave.type = 'button';
        btnWave.className = 'py-1.5 px-1 rounded-lg text-xs font-bold border transition text-center';
        btnWave.innerHTML = '<span class="block text-[11px]">' + d + '</span><span class="text-[9px] text-slate-400 font-normal">' + DIR_JA[d] + '</span>';
        btnWave.onclick = () => toggleBestWave(d);
        waveDiv.appendChild(btnWave);
      });
    }

    function selectSpot(key) {
      currentSpotKey = key;
      document.querySelectorAll('.spot-tab').forEach(b => {
        b.classList.remove('bg-white', 'text-sky-700', 'shadow-sm', 'border', 'border-slate-200');
        b.classList.add('text-slate-600');
      });
      const active = document.getElementById('tab-' + key);
      active.classList.remove('text-slate-600');
      active.classList.add('bg-white', 'text-sky-700', 'shadow-sm', 'border', 'border-slate-200');

      renderSpotForm();
    }

    function renderSpotForm() {
      const rule = CURRENT_RULES[currentSpotKey];
      document.getElementById('spotTitle').textContent = rule.name;
      document.getElementById('beachFacing').value = rule.beachFacing || 'W';

      document.getElementById('minPlayWave').value = rule.minPlayWave;
      document.getElementById('chestHeadWave').value = rule.chestHeadWave;
      document.getElementById('closeoutWave').value = rule.closeoutWave;
      document.getElementById('minPeriod').value = rule.minPeriod;
      document.getElementById('bestPeriod').value = rule.bestPeriod;

      DIRS_16.forEach(d => {
        const btn = document.getElementById('btn-off-' + d);
        if (rule.offshoreWinds.includes(d)) {
          btn.className = 'py-1.5 px-1 rounded-lg text-xs font-bold border transition text-center bg-emerald-100 text-emerald-800 border-emerald-400 shadow-sm';
        } else {
          btn.className = 'py-1.5 px-1 rounded-lg text-xs font-bold border transition text-center bg-slate-50 text-slate-600 border-slate-200 hover:bg-slate-100';
        }
      });
      document.getElementById('offshoreSummary').textContent = rule.offshoreWinds.join(', ') || '未選択';

      DIRS_16.forEach(d => {
        const btn = document.getElementById('btn-wave-' + d);
        if (rule.bestWaveDirs.includes(d)) {
          btn.className = 'py-1.5 px-1 rounded-lg text-xs font-bold border transition text-center bg-sky-100 text-sky-800 border-sky-400 shadow-sm';
        } else {
          btn.className = 'py-1.5 px-1 rounded-lg text-xs font-bold border transition text-center bg-slate-50 text-slate-600 border-slate-200 hover:bg-slate-100';
        }
      });
      document.getElementById('bestWaveSummary').textContent = rule.bestWaveDirs.join(', ') || '未選択';
    }

    function updateCurrentSpotValue(key, val) {
      CURRENT_RULES[currentSpotKey][key] = val;
    }

    function toggleOffshore(dir) {
      const arr = CURRENT_RULES[currentSpotKey].offshoreWinds;
      const idx = arr.indexOf(dir);
      if (idx >= 0) arr.splice(idx, 1);
      else arr.push(dir);
      renderSpotForm();
    }

    function toggleBestWave(dir) {
      const arr = CURRENT_RULES[currentSpotKey].bestWaveDirs;
      const idx = arr.indexOf(dir);
      if (idx >= 0) arr.splice(idx, 1);
      else arr.push(dir);
      renderSpotForm();
    }

    function resetToDefault() {
      if (!confirm('このポイントの設定を初期値に戻しますか？')) return;
      CURRENT_RULES[currentSpotKey] = JSON.parse(JSON.stringify(DEFAULT_RULES[currentSpotKey]));
      renderSpotForm();
      showStatus('初期値に戻しました（保存ボタンを押すと全体に反映されます）', 'text-amber-600');
    }

    function copyRulesJson() {
      navigator.clipboard.writeText(JSON.stringify(CURRENT_RULES, null, 2)).then(() => {
        showStatus('設定JSONをクリップボードにコピーしました！', 'text-sky-600');
      });
    }

    async function saveRulesToGitHub() {
      let token = localStorage.getItem(TOKEN_STORAGE_KEY);
      if (!token) {
        token = prompt('全ユーザーへの反映にはGitHubアクセストークン（PAT）が必要です。入力してください（この端末に記憶されます）:');
        if (!token) return;
        token = token.trim();
        localStorage.setItem(TOKEN_STORAGE_KEY, token);
      }

      const saveBtn = document.getElementById('saveBtn');
      saveBtn.disabled = true;
      saveBtn.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i><span>GitHubへ保存中...</span>';
      showStatus('GitHubへコミット中...', 'text-sky-600');

      try {
        const filePath = 'spot_rules.json';
        const getUrl = "https://api.github.com/repos/" + GITHUB_REPO + "/contents/" + filePath;
        
        let sha = null;
        const getRes = await fetch(getUrl, {
          headers: {
            "Authorization": "token " + token,
            "Accept": "application/vnd.github.v3+json"
          }
        });
        if (getRes.ok) {
          const fileInfo = await getRes.json();
          sha = fileInfo.sha;
        }

        const contentBase64 = btoa(unescape(encodeURIComponent(JSON.stringify(CURRENT_RULES, null, 2))));
        const putRes = await fetch(getUrl, {
          method: "PUT",
          headers: {
            "Authorization": "token " + token,
            "Accept": "application/vnd.github.v3+json",
            "Content-Type": "application/json"
          },
          body: JSON.stringify({
            message: "chore: update spot rules via admin panel",
            content: contentBase64,
            sha: sha || undefined
          })
        });

        if (putRes.ok) {
          showStatus('【成功】設定をGitHubに保存しました！数分で全サーファーに反映されます。', 'text-emerald-600');
        } else {
          const errData = await putRes.json();
          if (putRes.status === 401) {
            localStorage.removeItem(TOKEN_STORAGE_KEY);
            showStatus('トークンが無効または期限切れです。再入力してください。', 'text-rose-600');
          } else {
            showStatus('保存に失敗しました: ' + (errData.message || putRes.statusText), 'text-rose-600');
          }
        }
      } catch (err) {
        showStatus('通信エラーが発生しました: ' + err.message, 'text-rose-600');
      } finally {
        saveBtn.disabled = false;
        saveBtn.innerHTML = '<i class="fa-solid fa-cloud-arrow-up"></i><span>設定を保存して全ユーザーに反映する</span>';
      }
    }

    function showStatus(msg, colorClass) {
      const el = document.getElementById('statusMsg');
      el.className = "text-xs text-center font-bold min-h-[1.5rem] py-1 " + colorClass;
      el.textContent = msg;
    }

    function promptChangePassword() {
      const current = prompt('現在のパスワードを入力してください:');
      if (current !== getSavedPassword()) {
        alert('パスワードが違います。');
        return;
      }
      const newPass = prompt('新しいパスワードを入力してください（4文字以上）:');
      if (!newPass || newPass.trim().length < 4) {
        alert('4文字以上のパスワードを指定してください。');
        return;
      }
      localStorage.setItem(PASS_STORAGE_KEY, newPass.trim());
      alert('パスワードを変更しました！');
    }

    checkAuth();
  </script>
</body>
</html>

name: "Auto Fetch Surf Data & Deploy"

on:
  schedule:
    # 混雑ピーク(00分/30分)を回避し、毎時5分・20分・35分・50分（15分間隔）に自動実行
    - cron: '5,20,35,50 * * * *'
  workflow_dispatch: # 手動実行ボタンも有効化
  push:
    branches:
      - main

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  update-data:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    concurrency:
      group: "surf-data-update"
      cancel-in-progress: true
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Dependencies
        run: |
          npm ci || npm install --production

      - name: Run Fetch Data Script
        run: |
          node scripts/fetch_data.js

      - name: Send Push Notifications (Morning / Evening / Size-up Alerts)
        env:
          WEB_PUSH_SUBSCRIPTION: ${{ secrets.WEB_PUSH_SUBSCRIPTION }}
        run: |
          node scripts/send_push_notification.js

      - name: Commit and Push Updated Data and Notification History
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add data.json scripts/notification_history.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "chore: update live surf data & notification history [skip ci]" && git push)

  deploy-pages:
    needs: update-data
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    concurrency:
      group: "pages"
      cancel-in-progress: true
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
